[project]
name = "inference-lab"
version = "0.1.0"
description = "A bounded Nemotron OCR concurrency demo"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "Pillow==12.2.0"]
[project.scripts]
inference-axi = "inference_lab.cli:main"
[build-system]
requires = ["uv_build==0.11.20"]
build-backend = "uv_build"
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not gpu'"
markers = ["gpu: requires the explicitly started local Nemotron server"]
