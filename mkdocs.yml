site_name: inference-lab
site_description: Local document parsing with measured evidence and tagged experiments.
site_url: https://alberto-codes.github.io/inference-lab/
repo_url: https://github.com/Alberto-Codes/inference-lab
repo_name: Alberto-Codes/inference-lab
theme:
  name: material
  palette:
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            heading_level: 2
            show_signature_annotations: true
            show_submodules: false
validation:
  links:
    anchors: warn
    unrecognized_links: warn
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
extra_css:
  - stylesheets/landing.css
nav:
  - Overview: index.md
  - Get started:
      - Inspect saved results: tutorials/first-result.md
      - Run on your GPU: how-to/evaluate-receipts.md
  - Results and methods:
      - Receipt results: reference/receipt-results.md
      - Commands and scoring: reference/receipts.md
      - What the scores mean: explanation/receipt-evaluation.md
      - How the experiment works: explanation/how-it-works.md
      - Serving profile: reference/serving.md
      - Python API: reference/api.md
      - Data and licences: reference/public-audit.md
  - More guides:
      - Optional model review: how-to/review-with-a-model.md
      - Troubleshoot: how-to/troubleshoot.md
      - Synthetic smoke test: how-to/run-demo.md
      - Synthetic CLI: reference/cli.md
      - Synthetic results: reference/evidence.md
      - Measurement limits: explanation/measurement.md
      - Advanced service handover: how-to/service-handover.md
  - Maintainers:
      - Run quality checks: how-to/check-quality.md
      - Prepare an experiment release: how-to/cut-a-release.md
      - Writing rules: reference/writing.md
      - v0.1.0 (draft): releases/v0.1.0.md
