repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check --force-exclude
        language: system
        types: [python]
      - id: ty
        name: Python type checks
        entry: uv run --locked ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: docvet
        name: Docstring quality
        entry: uv run --locked docvet check --all
        language: system
        types: [python]
        pass_filenames: false
